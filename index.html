let actx;
function beep(f=880,ms=180,n=1,vib=150){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
 for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*(ms/1000+.09);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);o.start(t);o.stop(t+ms/1000+.02)}}catch(e){}
 if(navigator.vibrate)navigator.vibrate(vib)}
const RT={on:false,end:0,label:''};
function startRest(sec,label){RT.on=true;RT.end=Date.now()+sec*1000;RT.label=label||'Rest';RT.warned=false;$('#timerbar').style.display='block';beep(660,90)}
function stopRest(){RT.on=false;$('#timerbar').style.display='none'}
const HT={phase:'idle',round:0,endAt:0,remain:0,running:false};
const CT={running:false,start:0};
function htStart(){const d=S.draft;if(HT.phase==='idle'||HT.phase==='done'){HT.phase='ready';HT.round=0;HT.remain=3000}HT.running=true;HT.endAt=Date.now()+HT.remain;beep(660,120);render()}
function htPause(){HT.running=false;HT.remain=HT.endAt-Date.now();render()}
function htReset(){HT.phase='idle';HT.running=false;HT.round=0;render()}
function htAdvance(){const d=S.draft;const target=Math.max(1,num(d.target)||10);
 if(HT.phase==='work'){S.draft.rounds=HT.round;save();hiitLogRound();if(HT.round>=target){htDone();return}HT.phase='rest';HT.endAt+=num(d.rest||10)*1000;beep(392,650,1,500)}
 else{HT.phase='work';HT.round++;HT.endAt+=num(d.work||30)*1000;beep(1175,110,2,[90,50,90])}}
const hrRow=(i,v)=>`<label class="f" style="text-align:center">R${i+1}HR<input type="text" inputmode="numeric" style="text-align:center;padding:7px 4px;min-width:0;width:100%" data-hr="${i}" value="${esc(v||'')}" placeholder="bpm"></label>`;
function hiitDuration(d,n){const sec=n*num(d.work||30)+Math.max(0,n-1)*num(d.rest||10);return Math.round(sec/6)/10}
function hiitLogRound(){const n=HT.round,c=$('#hrCount'),l=$('#hrList');S.draft.duration=hiitDuration(S.draft,n);save();const di=document.querySelector('[data-f=duration]');if(di)di.value=S.draft.duration;if(c)c.textContent=n;if(l&&!l.querySelector(`[data-hr="${n-1}"]`))l.insertAdjacentHTML('beforeend',hrRow(n-1,(S.draft.hrs||[])[n-1]))}
function htDone(){HT.phase='done';HT.running=false;S.draft.rounds=HT.round;save();beep(880,200,3);render()}
function tick(){
 if(RT.on){const left=(RT.end-Date.now())/1000;$('#tbLabel').textContent=RT.label;$('#tbTime').textContent=mmss(left);
  if(left<=10&&!RT.warned){RT.warned=true;beep(740,80)}if(left<=0){beep(880,220,3);stopRest()}}
 if(HT.running){if(Date.now()>=HT.endAt)htAdvance();const el=$('#htT');if(el){el.textContent=mmss((HT.endAt-Date.now())/1000);const box=$('#htBox');box.className='timer '+HT.phase;$('#htPh').textContent=HT.phase==='ready'?'Get ready':HT.phase==='work'?'SPRINT: all out':'Rest';$('#htR').textContent=`Round ${HT.round} / ${S.draft.target||10}`}}
 if(CT.running){const el=$('#ctT');if(el)el.textContent=mmss((Date.now()-CT.start)/1000)}
}
setInterval(tick,200);

 <div class="card"><h3>Huberman videos & resources</h3><ul>${VIDEOS.map(v=>`<li><a href="${v.u}" target="_blank" rel="noopener">${esc(v.t)}</a></li>`).join('')}</ul></div>
 <div class="card"><h3>Exercise library (adapted to your home gym)</h3><p class="small muted">Dumbbells, barbell + rack + plates, adjustable bench, pull-up bar, Peloton Bike & Tread. "▶ Demo" opens a YouTube search for form videos. Use "Set video" to save a specific video you like.</p>
  ${Object.entries(libGroups).map(([g,list])=>`<h3 style="margin-top:14px">${esc(g)}</h3><table class="lib">${list.map(([id,e])=>`<tr><td>${esc(e.n)} <span class="pill">${esc(e.p)}</span><div class="small muted" style="font-weight:400">${esc(e.cue)}</div></td><td class="small muted">${esc(e.eq)}</td><td style="white-space:nowrap"><a class="btn sm" href="${esc(vidFor(id))}" target="_blank" rel="noopener">▶ Demo</a> <button class="btn sm ghost" data-a="setVid" data-v="${id}">${S.settings.videos[id]?'Change video':'Set video'}</button></td></tr>`).join('')}</table>`).join('')}
 </div>`;
}

function summary(s){
 if(s.kind==='resistance'){const sets=s.exercises.reduce((a,e)=>a+e.sets.length,0);const vol=s.exercises.reduce((a,e)=>a+e.sets.reduce((b,st)=>b+num(st.w)*num(st.r),0),0);
  return `${s.exercises.length} exercises · ${sets} sets${vol?` · ${Math.round(vol).toLocaleString()} ${S.settings.units} volume`:''}<div class="small muted">${s.exercises.map(e=>`${esc(exName(e.ex))}: ${e.sets.map(st=>`${st.w||'BW'}×${st.r||'?'}`).join(', ')}`).join('<br>')}</div>${neckLine(s)}`}
 if(s.kind==='cardio')return `${esc(s.mod)} · ${esc(s.min||'?')} min${s.hr?` · ${esc(s.hr)} bpm`:''}${s.dist?` · ${esc(s.dist)} ${S.settings.units==='kg'?'km':'mi'}`:''}${s.out?` · ${esc(s.out)} kJ`:''}${s.z2?' · Zone 2':''}`;
 if(s.kind==='hiit')return `${esc(s.mod)} · ${esc(s.rounds||'?')} rounds of ${esc(s.work)}s/${esc(s.rest)}s${s.maxhr?` · peak ${esc(s.maxhr)} bpm`:''}${(s.hrs||[]).slice(0,num(s.rounds)||0).some(Boolean)?` · HR ${(s.hrs||[]).slice(0,num(s.rounds)||0).map(h=>h||'–').join(', ')}`:''}`;
 if(s.kind==='cold')return `${(s.rounds||[]).length?`${s.rounds.length} cold round(s) · `:''}${coldMin(s).toFixed(1)} min cold${s.hot?` · ${esc(s.hot)} min sauna`:''}`;
 return '';
}
function vHistory(){
 const list=[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)||(b.start||0)-(a.start||0));
 if(!list.length)return `<div class="card"><h2>History</h2><p class="muted">Nothing logged yet. Your saved workouts will show up here.</p></div>`;
 return `<div class="card"><h2>History</h2><p class="small muted">${list.length} sessions logged</p></div>`+list.map(s=>`<div class="card"><div class="sess"><div><b>${fmtDate(s.date)}</b>: ${s.day?'Day '+s.day+' · ':''}${esc(dayInfo(s.day).title)} ${s.kind==='resistance'?`<span class="tag ${s.sched}">${s.sched}</span>`:''}${s.duration?` <span class="pill">${esc(s.duration)} min</span>`:''}${s.rpe?` <span class="pill">RPE ${esc(s.rpe)}</span>`:''}</div>
  <div class="row"><button class="btn sm" data-a="edit" data-v="${s.id}">Edit</button><button class="btn sm ghost danger" data-a="del" data-v="${s.id}">Delete</button></div></div>
  <div class="small" style="margin-top:4px">${summary(s)}</div>${s.notes?`<div class="small muted" style="margin-top:4px">“${esc(s.notes)}”</div>`:''}</div>`).join('');
}

function vSettings(){
 const s=S.settings;const sc=schedFor(todayStr());
 return `<div class="card"><h2>Settings</h2><div class="grid">
  <label class="f">Age (for heart-rate targets)<input type="text" inputmode="numeric" data-set="age" value="${esc(s.age)}"></label>
  <label class="f">Weight units<select data-set="units"><option value="lb" ${s.units==='lb'?'selected':''}>lb</option><option value="kg" ${s.units==='kg'?'selected':''}>kg</option></select></label>
  <label class="f">Cycle start date (Day 1 of cycle 1)<input type="date" data-set="cycleStart" value="${esc(cycleStart())}"></label>
  <label class="f">Rest timer: Schedule A (sec)<input type="text" inputmode="numeric" data-set="restA" value="${esc(s.restA)}"></label>
  <label class="f">Rest timer: Schedule B (sec)<input type="text" inputmode="numeric" data-set="restB" value="${esc(s.restB)}"></label>
 </div>
 <div class="row" style="margin-top:8px"><button class="btn sm" data-a="newCycle">Start a new cycle today</button><span class="small muted">Day 1 of the next cycle begins today.</span></div>
 <p class="small">Max HR ≈ <b>${maxHR()}</b> bpm · Zone 2 ≈ <b>${z2()[0]}–${z2()[1]}</b> · Moderate (Day 5) ≈ <b>${modHR()[0]}–${modHR()[1]}</b></p></div>
 <div class="card"><h3>Schedule A/B rotation</h3><p class="small">This month is <span class="tag ${sc}">Schedule ${sc}</span>. It flips automatically each calendar month.</p><button class="btn" data-a="swapAB">Swap A/B for this month onward</button></div>
 <div class="card"><h3>Backup & data</h3><p class="small muted">Your data is saved in this browser and, when you are signed in, synced to your private database. Export a backup now and then, and import it to move data between copies of the app.</p>
  <div class="row"><button class="btn" data-a="export">Export backup (.json)</button><label class="btn">Import backup<input type="file" accept=".json,application/json" id="imp" style="display:none"></label><button class="btn" data-a="csv">Export sets (.csv)</button><button class="btn danger" data-a="reset">Erase all data</button></div></div>
 <div class="card"><h3>Account</h3><p class="small muted">${Sync.email?`Signed in as <b>${esc(Sync.email)}</b>. Your data syncs to your private database.`:'Not signed in. Data is saved on this device only.'}</p><div class="row">${Sync.email?'<button class="btn" data-a="signOut">Sign out</button>':'<button class="btn pri" data-a="signIn">Sign in</button>'}</div></div>`;
}

/* ---------- actions ---------- */
const ACT={
 go:a=>go(a.dataset.v),
 start:a=>startDay(+a.dataset.v),
 startAlt:()=>startDay(+$('#altDay').value),
 finish:()=>finishDraft(),
 discard:async()=>{if(await confirmP('Discard this workout?','Discard',true)){S.draft=null;stopRest();HT.running=false;CT.running=false;save(true);go('today')}},
 addSet:a=>{const e=S.draft.exercises[+a.dataset.i];const l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:'',done:false,t:'working'});save();render()},
 rmSet:a=>{S.draft.exercises[+a.dataset.i].sets.splice(+a.dataset.j,1);save();render()},
 rmEx:a=>{S.draft.exercises.splice(+a.dataset.i,1);save();render()},
 addEx:async()=>{const n=await promptP('Exercise name (e.g. Farmer carry):');if(!n||!n.trim())return;const id='custom:'+n.trim();if(!S.settings.custom.includes(id))S.settings.custom.push(id);S.draft.exercises.push({slot:null,ex:id,sets:makeSets(id,S.draft.sched,S.draft.day)});save();render()},
 doneSet:a=>{const st=S.draft.exercises[+a.dataset.i].sets[+a.dataset.j];st.done=a.checked;
  if(st.done){if(!st.r){const inp=document.querySelector(`input[data-f=r][data-i="${a.dataset.i}"][data-j="${a.dataset.j}"]`);if(inp&&inp.placeholder&&/^\d+$/.test(inp.placeholder))st.r=inp.placeholder}
   if(!st.w){const inp=document.querySelector(`input[data-f=w][data-i="${a.dataset.i}"][data-j="${a.dataset.j}"]`);if(inp&&inp.placeholder&&inp.placeholder!=='—')st.w=inp.placeholder}
   startRest(S.draft.sched==='A'?num(S.settings.restA):num(S.settings.restB),'Rest · '+exName(S.draft.exercises[+a.dataset.i].ex))}
  save();render()},
 tbAdj:a=>{RT.end+=num(a.dataset.v)*1000},
 tbStop:()=>stopRest(),
 htStart:()=>htStart(),htPause:()=>htPause(),htReset:()=>htReset(),
 ctStart:()=>{CT.running=true;CT.start=Date.now();beep(660,100);render()},
 ctStop:()=>{const sec=Math.round((Date.now()-CT.start)/1000);CT.running=false;S.draft.rounds=S.draft.rounds||[];S.draft.rounds.push(sec);beep(880,150,2);save();render()},
 rmRound:a=>{S.draft.rounds.splice(+a.dataset.i,1);save();render()},
 edit:async a=>{if(S.draft&&!(await confirmP('Replace the workout in progress with this one for editing?','Replace',true)))return;const s=S.sessions.find(x=>x.id===a.dataset.v);S.draft=JSON.parse(JSON.stringify(s));S.draft.editing=true;save(true);go('workout')},
 del:async a=>{if(!(await confirmP('Delete this session?','Delete',true)))return;S.sessions=S.sessions.filter(x=>x.id!==a.dataset.v);save(true);render()},
 setVid:async a=>{const id=a.dataset.v;const u=await promptP('Paste a YouTube URL for "'+exName(id)+'" (blank resets to search):',S.settings.videos[id]||'');if(u===null)return;if(u.trim())S.settings.videos[id]=u.trim();else delete S.settings.videos[id];save(true);render()},
 hShift:a=>{const d=ymd(addDays(parse(habitDate),+a.dataset.v));if(d<=todayStr()){habitDate=d;render()}},
 hDate:a=>{if(a.dataset.v<=todayStr()){habitDate=a.dataset.v;render()}},
 signIn:()=>showAuth(),
 signOut:async()=>{if(!(await confirmP(Sync.dirty?'You have changes that have not synced yet. Sign out anyway? They will be lost on this device.':'Sign out and clear the data stored on this device? Your data stays safe in your database.','Sign out',true)))return;try{await Sync.sb.auth.signOut()}catch(e){}try{localStorage.removeItem(KEY);localStorage.removeItem(DIRTY_KEY)}catch(e){}location.reload()},
 newCycle:()=>{S.settings.cycleStart=todayStr();save(true);render();toast('New cycle starts today')},
 swapAB:()=>{const[y,m]=todayStr().split('-').map(Number);const cur=schedFor(todayStr());const t=new Date(y,m-1+(cur==='A'?-1:0),1);S.settings.schedAStart=`${t.getFullYear()}-${pad(t.getMonth()+1)}`;save(true);render();toast('This month is now Schedule '+schedFor(todayStr()))},
 export:()=>dl('huberman-tracker-backup-'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json'),
 csv:()=>{const rows=[['date','day','schedule','exercise','set','weight','reps_or_sec']];S.sessions.filter(s=>s.kind==='resistance').forEach(s=>s.exercises.forEach(e=>e.sets.forEach((st,i)=>rows.push([s.date,s.day,s.sched,exName(e.ex),i+1,st.w,st.r]))));
  dl('huberman-sets-'+todayStr()+'.csv',rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv')},
 reset:async()=>{if((await confirmP('Erase ALL workouts, habits and settings? Export a backup first if unsure.','Continue',true))&&(await confirmP('Really erase everything? This also clears your cloud copy.','Erase everything',true))){S=JSON.parse(JSON.stringify(DEF));save(true);go('today')}},
};
async function dl(name,text){try{const d=window.claude?await claude.use('downloads'):null;if(!d){toast('Saving files is not available here');return}await d.save({filename:name,data:text});toast('File saved')}catch(e){if(!e||e.code!=='declined')toast('Could not save the file')}}

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.tagName==='INPUT'&&a.type==='checkbox'){ACT[a.dataset.a](a,e);return}e.preventDefault();ACT[a.dataset.a]&&ACT[a.dataset.a](a,e)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.hr!==undefined&&S.draft){S.draft.hrs=S.draft.hrs||[];S.draft.hrs[+t.dataset.hr]=t.value;save();return}
 if(t.dataset.f&&S.draft&&t.type!=='checkbox'&&t.tagName!=='SELECT'){const f=t.dataset.f;if(f==='w'||f==='r'){const st=S.draft.exercises[+t.dataset.i].sets[+t.dataset.j];st[f]=t.value;
  if(f==='r'&&LOGV2(S.draft.day)){const was=st.done;st.done=t.value.trim()!=='';const tr=t.closest('tr');if(tr)tr.classList.toggle('d',st.done);if(st.done&&!was)startRest(S.draft.sched==='A'?num(S.settings.restA):num(S.settings.restB),'Rest \u2013 '+exName(S.draft.exercises[+t.dataset.i].ex))}}else S.draft[f]=t.value;save()}
 if(t.dataset.set&&t.tagName==='INPUT'){S.settings[t.dataset.set]=t.value;save()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f&&S.draft&&(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date')){
  const f=t.dataset.f;S.draft[f]=t.type==='checkbox'?t.checked:t.value;
  if(f==='date'&&S.draft.kind!=='resistance')S.draft.sched=schedFor(t.value);save();if(t.type==='date')render();return}
 if(t.dataset.f&&S.draft&&f_isText(t)){render();return}
 if(t.dataset.h){const ds=habitDate;S.habits[ds]=S.habits[ds]||{};S.habits[ds][t.dataset.h]=t.checked;save();render();return}
 if(t.dataset.set){let v=t.value;S.settings[t.dataset.set]=v;save(true);render();return}
 if(t.dataset.c==='swap'){const i=+t.dataset.i;const e2=S.draft.exercises[i];const hadDone=e2.sets.some(s=>s.done);e2.ex=t.value;if(!hadDone)e2.sets=makeSets(t.value,S.draft.sched,S.draft.day);if(e2.slot)S.settings.choices[e2.slot]=t.value;save();render();return}
 if(t.dataset.c==='stype'){S.draft.exercises[+t.dataset.i].sets[+t.dataset.j].t=t.value;save();return}
 if(t.dataset.c==='sched'){S.draft.sched=t.value;save();render();return}
 if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.sessions||!d.settings)throw 0;if(!(await confirmP('Replace current data with this backup?','Replace',true)))return;S=d;S.settings=Object.assign({},DEF.settings,S.settings);S.habits=S.habits||{};save(true);go('today');toast('Backup imported')}catch(err){toast('That file is not a valid tracker backup.')}};r.readAsText(t.files[0])}
});
function f_isText(t){return t.dataset.f==='target'||t.dataset.f==='work'||t.dataset.f==='rest'}
migRest();render();
Sync.init();
</script>

</body></html>
